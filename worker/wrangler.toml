# Umbral read-only API, published as umbral-api (https://umbral-api.juliacgastellu.workers.dev).
# Deploy with `npx wrangler deploy` from this folder after the owner's own `wrangler login`; no account id or token is stored here.
name = "umbral-api"
main = "src/index.ts"
compatibility_date = "2026-11-01"

[vars]
# CORS allow-list (not authentication): production and the two local dev ports. Never "*".
ALLOWED_ORIGINS = "https://umbral-altovalle.vercel.app,http://localhost:5199,http://localhost:5173"

# No secrets are needed: the API serves processed snapshots and the keyless Open-Meteo forecast.
# If an authenticated upstream is ever added, store it with `wrangler secret put NAME`, never in [vars] or VITE_ variables.
